name: CI - Build, Scan, and Push to ECR

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write  
  contents: read

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 1. GITLEAKS: Prevent Secret Leaks
      - name: Run Gitleaks Security Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. AWS OIDC LOGIN: No static keys needed anymore! 🔓
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: secret://${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}    
          role-session-name: GitHubActionsOIDCSession

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # 3. Build your Docker image
      - name: Build Docker Image
        run: |
          docker build -t meridian-auth:${{ github.sha }} ./auth-service
          docker tag meridian-auth:${{ github.sha }} ${{ secrets.ECR_REGISTRY_URL }}/meridian-auth:${{ github.sha }}

      # 4. TRIVY SCAN: Generates report, but lets the build pass (exit-code: '0')
      - name: Download Trivy HTML Template
        run: wget https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl -O html.tpl

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.ECR_REGISTRY_URL }}/meridian-auth:${{ github.sha }}'
          format: 'template'
          template: '@html.tpl'
          output: 'trivy-security-report.html'
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # <--- Non-blocking report generation

      # 5. UPLOAD REPORT ARTIFACT
      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-security-report
          path: trivy-security-report.html
          retention-days: 30

      # 6. Push to ECR using temporary OIDC credentials
      - name: Push Image to ECR
        run: |
          docker push ${{ secrets.ECR_REGISTRY_URL }}/meridian-auth:${{ github.sha }}