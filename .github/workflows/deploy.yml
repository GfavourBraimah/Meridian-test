name: CD - Deploy to EC2

on:
  workflow_run:
    workflows: ["CI - Build, Scan, and Push to ECR"]
    types:
      - completed

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # 1. AWS OIDC LOGIN (Keyless)
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}    
          role-session-name: GitHubActionsOIDCSession

      # 2. Get the current dynamic IP of this specific GitHub Runner
      - name: Get GitHub Runner IP
        id: runner-ip
        uses: haythem/public-ip@v1.3

      # 3. Open the AWS Security Group door JUST for this runner
      - name: Whitelist Runner IP
        run: |
          echo "Authorizing IP: ${{ steps.runner-ip.outputs.ipv4 }}/32 for SSH"
          aws ec2 authorize-security-group-ingress --group-id ${{ secrets.AWS_SG_ID }} --protocol tcp --port 22 --cidr ${{ steps.runner-ip.outputs.ipv4 }}/32

      # 4. Do the Secure Copy (SCP) now that the door is open
      - name: Copy docker-compose and nginx to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,nginx/"
          target: "/home/${{ secrets.EC2_USERNAME }}/meridian-retail"

      # 5. SSH in and run the deployment
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY_URL }}
            
            # Move Nginx conf to system folders and reload
            sudo cp /home/${{ secrets.EC2_USERNAME }}/meridian-retail/nginx/meridian-http.conf /etc/nginx/sites-available/meridian
            sudo ln -sf /etc/nginx/sites-available/meridian /etc/nginx/sites-enabled/
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t
            sudo systemctl reload nginx

            # Setup Docker Compose
            cd /home/${{ secrets.EC2_USERNAME }}/meridian-retail
            echo "IMAGE_TAG=${{ github.sha }}" > .env
            echo "ECR_REGISTRY_URL=${{ secrets.ECR_REGISTRY_URL }}" >> .env
            
            docker compose pull
            docker compose up -d

            # 🚀 GET THE PADLOCK: Provision TLS certificate via Certbot
            sudo certbot --nginx -d shop-meridian.duckdns.org --non-interactive --agree-tos -m bogreaper05@gmail.com --redirect --keep-until-expiring

      # 6. Lock the door behind us (runs ALWAYS, even if a previous step failed)
      - name: Revoke Runner IP from Security Group
        if: always()
        run: |
          echo "Revoking IP: ${{ steps.runner-ip.outputs.ipv4 }}/32 for SSH"
          aws ec2 revoke-security-group-ingress --group-id ${{ secrets.AWS_SG_ID }} --protocol tcp --port 22 --cidr ${{ steps.runner-ip.outputs.ipv4 }}/32