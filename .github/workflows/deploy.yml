name: CI - Build, Scan, and Push to ECR

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write  
  contents: read

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 1. GITLEAKS: Prevent Secret Leaks
      - name: Run Gitleaks Security Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. AWS OIDC LOGIN: Keyless authentication 🔓
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}    
          role-session-name: GitHubActionsOIDCSession

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # 3. Build, Tag, and Push ALL FOUR Microservices
      - name: Build and Push Auth Service
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/meridian-auth:$TAG ./auth-service
          docker push $REGISTRY/meridian-auth:$TAG

      - name: Build and Push Catalog Service
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/meridian-catalog:$TAG ./catalog-service
          docker push $REGISTRY/meridian-catalog:$TAG

      - name: Build and Push Orders Service
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/meridian-orders:$TAG ./orders-service
          docker push $REGISTRY/meridian-orders:$TAG

      - name: Build and Push Frontend
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/meridian-frontend:$TAG ./frontend
          docker push $REGISTRY/meridian-frontend:$TAG

      # 4. TRIVY SCAN: Generates report non-blocking (exit-code: '0')
      - name: Download Trivy HTML Template
        run: wget https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl -O html.tpl

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/meridian-auth:${{ github.sha }}'
          format: 'template'
          template: '@html.tpl'
          output: 'trivy-security-report.html'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # 5. UPLOAD REPORT ARTIFACT
      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-security-report
          path: trivy-security-report.html
          retention-days: 30