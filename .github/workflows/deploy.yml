name: CI - Build, Scan, and Push to ECR

on:
  push:
    branches: [ "main" ]

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Required for Gitleaks to scan commit history

      # 1. GITLEAKS: Prevent Secret Leaks in Git History
      - name: Run Gitleaks Security Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Configure AWS Credentials for ECR
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # 3. Build your Docker image (Example using Auth Service)
      - name: Build Docker Image
        run: |
          docker build -t meridian-auth:${{ github.sha }} ./auth-service
          docker tag meridian-auth:${{ github.sha }} ${{ secrets.ECR_REGISTRY_URL }}/meridian-auth:${{ github.sha }}

      # 4. TRIVY: Scan the Image & Generate HTML Report (Fails build if CRITICAL/HIGH found)
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.ECR_REGISTRY_URL }}/meridian-auth:${{ github.sha }}'
          format: 'template'
          template: '@/contrib/html.tpl'
          output: 'trivy-security-report.html'
          severity: 'CRITICAL,HIGH'
          exit-code: '1' # <--- This stops the build if vulns are detected!

      # 5. UPLOAD ARTIFACT: Saves the report even if the build fails
      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        if: always() # <--- Ensures this runs even when Trivy fails the build
        with:
          name: middleware-security-report
          path: trivy-security-report.html
          retention-days: 30

      # 6. Push to ECR only if security scans pass completely
      - name: Push Image to ECR
        run: |
          docker push ${{ secrets.ECR_REGISTRY_URL }}/meridian-auth:${{ github.sha }}